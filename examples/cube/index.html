<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nib: a cube in pure Wasm</title>
<link rel="stylesheet" href="style.css">
<canvas id="view"></canvas>
<div id="status"></div>
<aside>
  <h1>Nib</h1>
  <p>Logic in Wasm, shading in WGSL. <output id="fps">–</output> fps</p>
  <label>Speed <input id="speed" type="range" min="0" max="4" step="0.05" value="1"></label>
  <label>Light <input id="light" type="range" min="0" max="360" value="55"></label>
  <label>Colour <input id="color" type="color" value="#e8623a"></label>
</aside>
<script type="module" src="main.ts"></script>
</html>
